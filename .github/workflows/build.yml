name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install media test dependency
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Website checks
        run: |
          node scripts/test-site.cjs
          node scripts/test-demo.cjs
          node scripts/test-analytics.cjs
      - name: Test
        run: bash ./scripts/test.sh
      - name: Build
        run: bash ./scripts/build-app.sh
      - name: Package trial
        run: ditto -c -k --sequesterRsrc --keepParent "dist/MacMove.app" dist/MacMove-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacMove-macOS
          path: dist/MacMove-macOS.zip
