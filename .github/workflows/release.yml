name: Publish MacMove installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install media test dependency
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Build and test
        run: bash ./scripts/test.sh
      - name: Build unsigned installer
        env:
          UNSIGNED_INSTALLER: "1"
        run: bash scripts/package-installer.sh
      - name: Publish installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/MacMove.app/Contents/Info.plist')
          PACKAGE="dist/MacMove-$VERSION-macOS.pkg"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'This version is already published; increment the version to publish changes.'
            exit 1
          fi
          gh release create "v$VERSION" "$PACKAGE" "$PACKAGE.sha256" --target "$GITHUB_SHA" --title "MacMove by Oasis $VERSION" --notes 'Unsigned macOS installer for direct sharing. Open the .pkg and follow Installer steps. The app is installed in Applications and requires macOS 26 or later. macOS may show security warnings because this package is not signed or notarized. Some media and codec features require optional FFmpeg.'
